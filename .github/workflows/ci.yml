name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm --prefix tools/md-viewer ci --ignore-scripts
      # Server boundary tests create POSIX-style symlinks; run that suite on Linux.
      - name: Test reader and repository grouping
        if: runner.os == 'Linux'
        run: npm --prefix tools/md-viewer test
      - name: Test cross-platform path parsing on Windows
        if: runner.os == 'Windows'
        run: node --test tools/md-viewer/path-input.spec.mjs
      - name: Test Windows launch and navigation boundaries
        run: npm --prefix tools/md-viewer run test:win
