name: Desktop Release

# Publish only when explicitly requested; pushing an existing release tag is safe.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag matching package version, e.g. v0.3.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify tag and package versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const paths = [
            'tools/md-viewer/package.json',
            'tools/md-viewer/package-lock.json',
            'tools/md-viewer/windows/package.json',
            'tools/md-viewer/windows/package-lock.json',
          ];
          const versions = paths.map(p => JSON.parse(readFileSync(p, 'utf8')).version);
          const version = versions[0];
          if (!/^\d+\.\d+\.\d+$/.test(version) ||
              versions.some(v => v !== version) ||
              process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Tag must be vVERSION and all package/lockfile versions must match.');
          }
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ncommit=${commit}\n`);
          NODE
      - run: npm --prefix tools/md-viewer ci --ignore-scripts
      - run: npm --prefix tools/md-viewer test
      - run: npm --prefix tools/md-viewer run test:win

  build:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm --prefix tools/md-viewer ci --ignore-scripts
      - name: Test Windows paths and wrapper
        run: |
          node --test tools/md-viewer/path-input.spec.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix tools/md-viewer run test:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows x64 offline EXE installer and SHA-256
        run: npm --prefix tools/md-viewer run build:win
      - name: Install, launch, and uninstall the actual Windows application
        shell: pwsh
        run: ./tools/md-viewer/windows/installer-smoke.ps1 -Installer ./tools/md-viewer/windows/build/RDViewer-${{ needs.validate.outputs.version }}-windows-x64-setup.exe
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-update-diagnostics
          path: |
            ~/AppData/Roaming/RDViewer/updates/update-result.json
            ~/AppData/Roaming/RDViewer/updates/update-helper.stdout.log
            ~/AppData/Roaming/RDViewer/updates/update-helper.stderr.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            tools/md-viewer/windows/build/RDViewer-${{ needs.validate.outputs.version }}-windows-x64-setup.exe
            tools/md-viewer/windows/build/RDViewer-${{ needs.validate.outputs.version }}-windows-x64-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-mac:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - run: npm --prefix tools/md-viewer ci --ignore-scripts
      - name: Verify reader and updater on macOS
        run: npm --prefix tools/md-viewer test
      - name: Package standalone macOS app and SHA-256
        run: node tools/md-viewer/macos/package.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            tools/md-viewer/macos/build/RDViewer-${{ needs.validate.outputs.version }}-macos-${{ matrix.arch }}.zip
            tools/md-viewer/macos/build/RDViewer-${{ needs.validate.outputs.version }}-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [validate, build, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true
          path: release-assets
      - name: Verify and publish release assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          installer="RDViewer-${RELEASE_VERSION}-windows-x64-setup.exe"
          sha256sum --check "${installer}.sha256"
          for arch in arm64 x64; do
            archive="RDViewer-${RELEASE_VERSION}-macos-${arch}.zip"
            sha256sum --check "${archive}.sha256"
          done
          current_commit="$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)"
          test "$current_commit" = "$RELEASE_COMMIT"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "RDViewer ${RELEASE_VERSION}" --generate-notes
          fi
          # Never replace already-published binaries. A changed build needs a new version.
          gh release upload "$RELEASE_TAG" "$installer" "${installer}.sha256" RDViewer-*-macos-*.zip RDViewer-*-macos-*.zip.sha256
          gh release edit "$RELEASE_TAG" --draft=false
